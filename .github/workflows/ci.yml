name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm run test:coverage
      - name: Production build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Dependency audit (runtime)
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: pandaro-web-dist
          path: dist
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t pandaro:ci .
      - name: Smoke test
        run: |
          docker run -d --name pandaro -p 8080:8080 --read-only --tmpfs /tmp pandaro:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsSI http://localhost:8080/ | grep -qi 'content-security-policy'
          docker rm -f pandaro

  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pandaro
          POSTGRES_PASSWORD: pandaro
          POSTGRES_DB: pandaro_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pandaro" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install Postgres 16 client tools (backup tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          pg_dump --version | grep -E ' 16\\.'
          pg_restore --version | grep -E ' 16\\.'
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Tests (real Postgres)
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://pandaro:pandaro@localhost:5432/pandaro_test
      - name: Build
        run: npm run build
      - name: Dependency audit (runtime)
        run: npm audit --omit=dev --audit-level=high
      - name: Failover drill (2 API instances, Postgres primary + replica)
        run: node scripts/failover-drill.mjs
