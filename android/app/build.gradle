apply plugin: 'com.android.application'

// Version comes from package.json: versionCode = major*10000 + minor*100 + patch.
def appVersion = new groovy.json.JsonSlurper().parse(file('../../package.json')).version
def (vMajor, vMinor, vPatch) = appVersion.tokenize('.').collect { it.replaceAll(/[^0-9].*/, '') as int }

// Release signing: android/keystore.properties (git-ignored) or environment variables.
// Without either, release builds are produced unsigned (sign them later or via Play App Signing).
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }
def signingValue = { String key, String env -> keystoreProps.getProperty(key) ?: System.getenv(env) }
def releaseStore = signingValue('storeFile', 'PANDARO_KEYSTORE')
def hasReleaseSigning = releaseStore && file(releaseStore).exists()

android {
    namespace = "com.purysho.pandaro"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.purysho.pandaro"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode vMajor * 10000 + vMinor * 100 + vPatch
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStore)
                storePassword signingValue('storePassword', 'PANDARO_KEYSTORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'PANDARO_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'PANDARO_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }
    lint {
        abortOnError true
        checkReleaseBuilds true
        warningsAsErrors false
        // Capacitor-generated Gradle files pin dependency versions; updates are handled by Capacitor upgrades.
        disable 'GradleDependency', 'NewerVersionAvailable', 'AndroidGradlePluginVersion'
        // Resources such as the notification icon are referenced by name at runtime (see res/raw/keep.xml).
        disable 'UnusedResources'
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
