# High-availability drill: two stateless API instances behind a load balancer, Postgres primary
# with a synchronous streaming replica. Used by scripts/failover-drill.mjs; also a template for
# self-hosting. Managed hosting (Fly.io / Render) provides the database part for you.
#
#   cp deploy/.env.ha.example deploy/.env.ha   # then fill in secrets
#   docker compose -f deploy/compose.ha.yaml --env-file deploy/.env.ha up -d --build
name: pandaro-ha

x-api: &api
  build:
    context: ..
    secrets: [ca]
  image: pandaro-api:dev
  restart: unless-stopped
  depends_on:
    db-primary:
      condition: service_healthy
  environment: &api-env
    NODE_ENV: production
    DATABASE_URLS: postgres://pandaro:${POSTGRES_PASSWORD}@db-primary:5432/pandaro,postgres://pandaro:${POSTGRES_PASSWORD}@db-replica:5432/pandaro
    PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8088}
    APP_URL: ${APP_URL:-http://localhost:8080}
    CORS_ORIGINS: ${APP_URL:-http://localhost:8080}
    PEPPER: ${PEPPER}
    JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
    JWT_KEY_ID: ${JWT_KEY_ID:-k1}
    KEKS: ${KEKS}
    ACTIVE_KEK: ${ACTIVE_KEK}
    TRUST_PROXY: 'true'
    MAIL_TRANSPORT: log
  read_only: true
  tmpfs: [/tmp]

services:
  db-primary:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: pandaro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pandaro
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=5
      - -c
      - max_replication_slots=5
    volumes:
      - ./primary-init.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
      - primary-data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP, so it only passes once the real server (not the setup one) is up.
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U pandaro -d pandaro]
      interval: 2s
      retries: 30

  db-replica:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: pandaro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
    entrypoint: [/replica-entrypoint.sh]
    volumes:
      - ./replica-entrypoint.sh:/replica-entrypoint.sh:ro
      - replica-data:/var/lib/postgresql/data
    depends_on:
      db-primary:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U pandaro]
      interval: 2s
      retries: 30

  api1:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_ID: api1
  api2:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_ID: api2

  lb:
    image: ${NGINX_IMAGE:-nginx:1.29-alpine}
    volumes:
      - ./nginx-lb.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - ${API_PORT:-8088}:8080
    depends_on: [api1, api2]

secrets:
  ca:
    file: ${CA_FILE:-/dev/null}

volumes:
  primary-data:
  replica-data:
