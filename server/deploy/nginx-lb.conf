# Load balancer for the failover drill. Requests are spread over both API instances; if one is
# down, nginx retries the same request on the other. Pandaro's writes are idempotent, so
# retrying a POST is safe (proxy_next_upstream ... non_idempotent).
upstream pandaro_api {
  server api1:3000 max_fails=1 fail_timeout=5s;
  server api2:3000 max_fails=1 fail_timeout=5s;
}

server {
  listen 8080;
  client_max_body_size 10m;

  location / {
    proxy_pass http://pandaro_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
    proxy_next_upstream_tries 2;
  }
}
